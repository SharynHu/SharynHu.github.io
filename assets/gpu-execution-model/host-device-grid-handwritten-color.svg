<?xml version="1.0"?>
<svg width="1600" height="620" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <title id="title">Colored handwritten CPU host to GPU grid execution model</title>
 <desc id="desc">A colored hand-drawn style diagram showing a CPU Python process launching work to a GPU grid containing blocks and threads.</desc>
 <defs>
  <style>.ink {
        fill: none;
        stroke: #111;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#paper-jitter);
      }
      .thin {
        fill: none;
        stroke: #111;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: url(#paper-jitter);
      }
      .arrow {
        fill: none;
        stroke: #111;
        stroke-width: 3.2;
        stroke-linecap: round;
        marker-end: url(#arrowhead);
        filter: url(#paper-jitter);
      }
      .label {
        font-family: &quot;Comic Sans MS&quot;, &quot;Comic Neue&quot;, &quot;Chalkboard SE&quot;, &quot;Marker Felt&quot;, cursive;
        font-size: 44px;
        fill: #111;
      }
      .label-lg {
        font-family: &quot;Comic Sans MS&quot;, &quot;Comic Neue&quot;, &quot;Chalkboard SE&quot;, &quot;Marker Felt&quot;, cursive;
        font-size: 58px;
        fill: #111;
      }
      .label-sm {
        font-family: &quot;Comic Sans MS&quot;, &quot;Comic Neue&quot;, &quot;Chalkboard SE&quot;, &quot;Marker Felt&quot;, cursive;
        font-size: 36px;
        fill: #111;
      }
      .wash-cpu { fill: #fff4bf; opacity: 0.78; filter: url(#paper-jitter); }
      .wash-process { fill: #ffe1a8; opacity: 0.72; filter: url(#paper-jitter); }
      .wash-gpu { fill: #dbeafe; opacity: 0.58; filter: url(#paper-jitter); }
      .wash-grid { fill: #eefdf6; opacity: 0.72; filter: url(#paper-jitter); }
      .wash-b0 { fill: #fee2e2; opacity: 0.76; filter: url(#paper-jitter); }
      .wash-b1 { fill: #ede9fe; opacity: 0.78; filter: url(#paper-jitter); }
      .wash-b2 { fill: #dff7ed; opacity: 0.78; filter: url(#paper-jitter); }
      .thread-fill { fill: #fffdf4; opacity: 0.95; filter: url(#paper-jitter); }
      .blue-ink { stroke: #2563eb; }
      .arrow-fill { fill: #2563eb; filter: url(#paper-jitter); }
      .cpu-text { fill: #92400e; }
      .gpu-text { fill: #1d4ed8; }
      .grid-text { fill: #047857; }
      .block0-text { fill: #b91c1c; }
      .block1-text { fill: #6d28d9; }
      .block2-text { fill: #047857; }</style>
 </defs>
