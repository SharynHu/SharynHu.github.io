<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="520" viewBox="0 0 1700 520" role="img" aria-labelledby="title desc">
  <title id="title">FP8 KV cache quantization and dequantization pipeline</title>
  <desc id="desc">A straight pipeline showing FP16/BF16 K and V values being quantized into FP8 cache storage, then dequantized back into approximate K and V values for attention.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102030" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 34px;
        font-weight: 800;
        fill: #18202a;
      }
      .subtitle {
        font-size: 19px;
        font-weight: 500;
        fill: #64748b;
      }
      .step-title {
        font-size: 22px;
        font-weight: 800;
      }
      .step-text {
        font-size: 17px;
        font-weight: 560;
      }
      .label {
        font-size: 17px;
        font-weight: 750;
      }
      .small {
        font-size: 15px;
        font-weight: 650;
      }
    </style>
  </defs>

  <rect x="24" y="24" width="1652" height="472" rx="30" fill="#fbfaf8"/>
  <text x="70" y="78" class="title">FP8 KV Cache: Straight Write / Read Pipeline</text>
  <text x="70" y="112" class="subtitle">Quantization happens when writing cache; dequantization happens when reading cache. The external quantization scale travels as metadata.</text>

  <rect x="70" y="146" width="710" height="276" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="920" y="146" width="710" height="276" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="106" y="184" class="label" fill="#1d4ed8">WRITE CACHE: quantize</text>
  <text x="956" y="184" class="label" fill="#b45309">READ CACHE: dequantize</text>

  <g filter="url(#shadow)">
    <rect x="100" y="224" width="170" height="116" rx="15" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="330" y="224" width="180" height="116" rx="15" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="570" y="224" width="180" height="116" rx="15" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>

    <rect x="770" y="214" width="180" height="136" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>

    <rect x="970" y="224" width="180" height="116" rx="15" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="1210" y="224" width="180" height="116" rx="15" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="1450" y="224" width="150" height="116" rx="15" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  </g>

  <text x="185" y="265" text-anchor="middle" class="step-title" fill="#1e3a8a">FP16/BF16</text>
  <text x="185" y="296" text-anchor="middle" class="step-text" fill="#334155">K,V values</text>

  <text x="420" y="260" text-anchor="middle" class="step-title" fill="#1e3a8a">divide by</text>
  <text x="420" y="290" text-anchor="middle" class="step-title" fill="#1e3a8a">quant scale</text>
  <text x="420" y="318" text-anchor="middle" class="small" fill="#64748b">external metadata</text>

  <text x="660" y="265" text-anchor="middle" class="step-title" fill="#1e3a8a">round / clamp</text>
  <text x="660" y="296" text-anchor="middle" class="step-text" fill="#334155">to FP8 values</text>

  <text x="860" y="255" text-anchor="middle" class="step-title" fill="#334155">KV cache</text>
  <text x="860" y="287" text-anchor="middle" class="step-text" fill="#475569">FP8 bytes</text>
  <text x="860" y="315" text-anchor="middle" class="step-text" fill="#475569">+ quant scale</text>

  <text x="1060" y="260" text-anchor="middle" class="step-title" fill="#92400e">decode FP8</text>
  <text x="1060" y="290" text-anchor="middle" class="step-text" fill="#334155">sign / exp / mantissa</text>
  <text x="1060" y="318" text-anchor="middle" class="small" fill="#64748b">internal exponent scale</text>

  <text x="1300" y="260" text-anchor="middle" class="step-title" fill="#92400e">multiply by</text>
  <text x="1300" y="290" text-anchor="middle" class="step-title" fill="#92400e">quant scale</text>
  <text x="1300" y="318" text-anchor="middle" class="small" fill="#64748b">external metadata</text>

  <text x="1525" y="265" text-anchor="middle" class="step-title" fill="#92400e">approx K,V</text>
  <text x="1525" y="296" text-anchor="middle" class="step-text" fill="#334155">used by attention</text>

  <line x1="270" y1="282" x2="318" y2="282" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="510" y1="282" x2="558" y2="282" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="750" y1="282" x2="758" y2="282" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="950" y1="282" x2="958" y2="282" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <line x1="1150" y1="282" x2="1198" y2="282" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <line x1="1390" y1="282" x2="1438" y2="282" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-amber)"/>

  <rect x="118" y="382" width="600" height="28" rx="14" fill="#dbeafe"/>
  <text x="418" y="402" text-anchor="middle" class="small" fill="#1e3a8a">write path stores compact FP8 cache</text>

  <rect x="982" y="382" width="590" height="28" rx="14" fill="#ffedd5"/>
  <text x="1277" y="402" text-anchor="middle" class="small" fill="#92400e">read path reconstructs approximate higher-precision values</text>

  <text x="850" y="458" text-anchor="middle" class="small" fill="#64748b">Only the FP8 byte is the dtype value. The quant scale is separate metadata associated with the cache tensor/block.</text>
</svg>
