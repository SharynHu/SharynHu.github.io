<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">FP8 KV cache write and read flow</title>
  <desc id="desc">A flat technical diagram showing the FP8 KV cache write path, read path, and external quantization scale metadata.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowMeta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 38px;
        font-weight: 850;
        fill: #111827;
      }
      .subtitle {
        font-size: 20px;
        font-weight: 560;
        fill: #64748b;
      }
      .panel-title {
        font-size: 28px;
        font-weight: 820;
      }
      .step-title {
        font-size: 23px;
        font-weight: 800;
      }
      .step-copy {
        font-size: 17px;
        font-weight: 600;
        fill: #475569;
      }
      .chip {
        font-size: 15px;
        font-weight: 760;
      }
      .meta-title {
        font-size: 27px;
        font-weight: 830;
        fill: #334155;
      }
      .meta-copy {
        font-size: 18px;
        font-weight: 610;
        fill: #64748b;
      }
    </style>
  </defs>

  <rect width="1440" height="1040" fill="#ffffff"/>
  <rect x="32" y="32" width="1376" height="976" rx="28" fill="#fbfaf8" stroke="#e2e8f0" stroke-width="2"/>

  <text x="86" y="96" class="title">FP8 KV Cache: Quantize on Write, Dequantize on Read</text>
  <text x="86" y="130" class="subtitle">FP8 bytes carry the compact values. Quant-scale metadata tells the backend how to map them back to tensor values.</text>

  <rect x="86" y="178" width="520" height="610" rx="22" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="834" y="178" width="520" height="610" rx="22" fill="#fff6eb" stroke="#fdba74" stroke-width="2"/>
  <text x="126" y="232" class="panel-title" fill="#1d4ed8">Write cache path</text>
  <text x="874" y="232" class="panel-title" fill="#c2410c">Read cache path</text>

  <g>
    <rect x="150" y="276" width="392" height="96" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="424" width="392" height="96" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="572" width="392" height="96" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="720" width="392" height="96" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>

    <rect x="898" y="276" width="392" height="96" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="898" y="424" width="392" height="96" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="898" y="572" width="392" height="96" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="898" y="720" width="392" height="96" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  </g>

  <text x="346" y="313" text-anchor="middle" class="step-title" fill="#1e3a8a">FP16/BF16 K,V</text>
  <text x="346" y="344" text-anchor="middle" class="step-copy">produced by model</text>

  <text x="346" y="462" text-anchor="middle" class="step-title" fill="#1e3a8a">Divide by quant scale</text>
  <text x="346" y="493" text-anchor="middle" class="step-copy">fit tensor values into FP8 range</text>

  <text x="346" y="610" text-anchor="middle" class="step-title" fill="#1e3a8a">Round / clamp</text>
  <text x="346" y="641" text-anchor="middle" class="step-copy">choose nearest representable FP8 value</text>

  <text x="346" y="758" text-anchor="middle" class="step-title" fill="#1e3a8a">Store cache</text>
  <text x="346" y="789" text-anchor="middle" class="step-copy">FP8 bytes</text>

  <text x="1094" y="313" text-anchor="middle" class="step-title" fill="#9a3412">Load cache</text>
  <text x="1094" y="344" text-anchor="middle" class="step-copy">FP8 bytes</text>

  <text x="1094" y="462" text-anchor="middle" class="step-title" fill="#9a3412">Decode FP8 byte</text>
  <text x="1094" y="493" text-anchor="middle" class="step-copy">sign, exponent, mantissa</text>

  <text x="1094" y="610" text-anchor="middle" class="step-title" fill="#9a3412">Multiply by quant scale</text>
  <text x="1094" y="641" text-anchor="middle" class="step-copy">recover approximate K,V</text>

  <text x="1094" y="758" text-anchor="middle" class="step-title" fill="#9a3412">Attention uses K,V</text>
  <text x="1094" y="789" text-anchor="middle" class="step-copy">dequant may be fused into kernel</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M346 372 L346 411" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M346 520 L346 559" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M346 668 L346 707" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M1094 372 L1094 411" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1094 520 L1094 559" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1094 668 L1094 707" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  </g>

  <rect x="390" y="868" width="660" height="92" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="720" y="906" text-anchor="middle" class="meta-title">Quant scale metadata</text>
  <text x="720" y="936" text-anchor="middle" class="meta-copy">stored alongside or associated with the KV cache region</text>

  <g fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 9">
    <path d="M508 868 C454 836 410 806 360 817 C338 821 330 833 325 853 C317 887 320 830 340 790" marker-end="url(#arrowMeta)"/>
    <path d="M932 868 C980 838 1028 812 1080 823 C1108 829 1126 848 1126 874 C1127 904 1143 846 1107 790" marker-end="url(#arrowMeta)"/>
  </g>

  <rect x="132" y="848" width="428" height="28" rx="14" fill="#dbeafe"/>
  <text x="346" y="868" text-anchor="middle" class="chip" fill="#1e3a8a">write: scale is used before FP8 rounding</text>

  <rect x="880" y="848" width="428" height="28" rx="14" fill="#ffedd5"/>
  <text x="1094" y="868" text-anchor="middle" class="chip" fill="#9a3412">read: scale reconstructs approximate K,V</text>
</svg>
