<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">FP8 KV cache quantization and dequantization flow</title>
  <desc id="desc">The diagram separates the internal exponent scale inside FP8 values from the external quantization scale metadata used when writing and reading KV cache.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#102030" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 36px;
        font-weight: 800;
        fill: #18202a;
      }
      .subtitle {
        font-size: 20px;
        font-weight: 500;
        fill: #64748b;
      }
      .lane {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .box-title {
        font-size: 24px;
        font-weight: 800;
      }
      .box-text {
        font-size: 18px;
        font-weight: 550;
      }
      .small {
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect x="24" y="24" width="1452" height="772" rx="30" fill="#fbfaf8"/>
  <text x="70" y="82" class="title">FP8 KV Cache: Quantize on Write, Dequantize on Read</text>
  <text x="70" y="118" class="subtitle">The FP8 byte has its own internal exponent scale; the KV-cache scheme adds external quantization-scale metadata.</text>

  <rect x="70" y="154" width="640" height="562" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <rect x="790" y="154" width="640" height="562" rx="24" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>

  <text x="110" y="202" class="lane" fill="#1d4ed8">Write cache path</text>
  <text x="830" y="202" class="lane" fill="#b45309">Read cache path</text>

  <g filter="url(#shadow)">
    <rect x="110" y="242" width="240" height="108" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="420" y="242" width="240" height="108" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="110" y="430" width="240" height="118" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="420" y="430" width="240" height="118" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>

    <rect x="850" y="242" width="240" height="108" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="1160" y="242" width="220" height="108" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="850" y="430" width="240" height="118" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
    <rect x="1160" y="430" width="220" height="118" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  </g>

  <text x="230" y="282" text-anchor="middle" class="box-title" fill="#1e3a8a">FP16/BF16 K,V</text>
  <text x="230" y="314" text-anchor="middle" class="box-text" fill="#334155">produced by model</text>

  <text x="540" y="282" text-anchor="middle" class="box-title" fill="#1e3a8a">divide by quant scale</text>
  <text x="540" y="314" text-anchor="middle" class="box-text" fill="#334155">fit tensor values into FP8 range</text>

  <text x="230" y="474" text-anchor="middle" class="box-title" fill="#1e3a8a">round / clamp</text>
  <text x="230" y="506" text-anchor="middle" class="box-text" fill="#334155">choose nearest FP8 value</text>

  <text x="540" y="474" text-anchor="middle" class="box-title" fill="#1e3a8a">store cache</text>
  <text x="540" y="506" text-anchor="middle" class="box-text" fill="#334155">FP8 bytes + scale metadata</text>

  <path d="M 350 296 L 407 296" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 540 350 C 540 384 230 386 230 418" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 350 489 L 407 489" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <text x="970" y="282" text-anchor="middle" class="box-title" fill="#92400e">load cache</text>
  <text x="970" y="314" text-anchor="middle" class="box-text" fill="#334155">FP8 bytes + scale metadata</text>

  <text x="1270" y="274" text-anchor="middle" class="box-title" fill="#92400e">decode FP8 byte</text>
  <text x="1270" y="306" text-anchor="middle" class="box-text" fill="#334155">sign, exponent, mantissa</text>
  <text x="1270" y="330" text-anchor="middle" class="small" fill="#64748b">internal exponent scale</text>

  <text x="970" y="474" text-anchor="middle" class="box-title" fill="#92400e">multiply by quant scale</text>
  <text x="970" y="506" text-anchor="middle" class="box-text" fill="#334155">recover approximate K,V</text>

  <text x="1270" y="474" text-anchor="middle" class="box-title" fill="#92400e">attention uses K,V</text>
  <text x="1270" y="506" text-anchor="middle" class="box-text" fill="#334155">often fused in one kernel</text>

  <path d="M 1090 296 L 1147 296" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-amber)"/>
  <path d="M 1270 350 C 1270 384 970 386 970 418" stroke="#d97706" stroke-width="4" fill="none" marker-end="url(#arrow-amber)"/>
  <path d="M 1090 489 L 1147 489" stroke="#d97706" stroke-width="4" marker-end="url(#arrow-amber)"/>

  <rect x="430" y="610" width="640" height="92" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="750" y="646" text-anchor="middle" class="box-title" fill="#334155">Quant scale is external metadata</text>
  <text x="750" y="678" text-anchor="middle" class="box-text" fill="#475569">It may be shared per tensor, layer, head, token, or cache block.</text>

  <path d="M 735 655 C 660 655 620 570 560 550" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow-slate)"/>
  <path d="M 765 655 C 865 655 905 570 960 550" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow-slate)"/>

  <rect x="110" y="742" width="1280" height="26" rx="13" fill="#e2e8f0"/>
  <rect x="110" y="742" width="640" height="26" rx="13" fill="#93c5fd"/>
  <rect x="750" y="742" width="640" height="26" rx="13" fill="#fdba74"/>
  <text x="430" y="761" text-anchor="middle" class="small" fill="#1e3a8a">write: quantization happens when cache is stored</text>
  <text x="1070" y="761" text-anchor="middle" class="small" fill="#92400e">read: dequantization happens when cache is consumed</text>
</svg>
