<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Floating point bit layout</title>
  <desc id="desc">A floating point number is split into three fields: sign bit, exponent bits, and mantissa bits.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102030" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e11d48"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1152" height="292" rx="28" fill="#fbfaf8"/>
  <text x="70" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#20242a">Floating-point binary layout</text>
  <text x="70" y="112" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#65717f">Each stored value is decoded from sign, exponent, and mantissa fields.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="145" width="140" height="92" rx="14" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/>
    <rect x="220" y="145" width="330" height="92" rx="0" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <rect x="550" y="145" width="570" height="92" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <line x1="220" y1="145" x2="220" y2="237" stroke="#ffffff" stroke-width="4"/>
    <line x1="550" y1="145" x2="550" y2="237" stroke="#ffffff" stroke-width="4"/>
  </g>

  <text x="150" y="184" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#9f1239">sign</text>
  <text x="150" y="212" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#be123c">+ / -</text>

  <text x="385" y="184" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#1d4ed8">exponent</text>
  <text x="385" y="212" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#2563eb">scale / range</text>

  <text x="835" y="184" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800" fill="#92400e">mantissa</text>
  <text x="835" y="212" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#b45309">digits / precision</text>

  <g opacity="0.7">
    <rect x="102" y="157" width="18" height="18" rx="4" fill="#fb7185"/>
    <rect x="242" y="157" width="18" height="18" rx="4" fill="#60a5fa"/>
    <rect x="272" y="157" width="18" height="18" rx="4" fill="#93c5fd"/>
    <rect x="302" y="157" width="18" height="18" rx="4" fill="#60a5fa"/>
    <rect x="572" y="157" width="18" height="18" rx="4" fill="#fbbf24"/>
    <rect x="602" y="157" width="18" height="18" rx="4" fill="#f59e0b"/>
    <rect x="632" y="157" width="18" height="18" rx="4" fill="#fbbf24"/>
    <rect x="662" y="157" width="18" height="18" rx="4" fill="#f59e0b"/>
  </g>

  <path d="M 150 248 L 150 279" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow-rose)"/>
  <path d="M 385 248 L 385 279" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 835 248 L 835 279" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <text x="150" y="304" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650" fill="#9f1239">one bit</text>
  <text x="385" y="304" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650" fill="#1d4ed8">controls magnitude</text>
  <text x="835" y="304" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650" fill="#92400e">controls resolution</text>
</svg>
