---
layout: page
title: Sharyn's Blog
hide_header: true
---
<p class="page-nav"><a href="/">Home</a></p>

<header class="archive-header">
	<h1>{{ page.title }}</h1>
	<p>Technical notes and implementation writeups.</p>
</header>

<section class="post-list">
	{% assign english_posts = site.posts | where: "lang", "en" %}
	{% for post in english_posts %}
	<article class="post-card">
		<p class="post-card-date">{{ post.date | date_to_string }}</p>
		<h2><a href="{{ post.url }}" title="{{ post.title }}">{{ post.title }}</a></h2>
	</article>
	{% endfor %}
</section>
