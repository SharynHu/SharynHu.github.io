<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Sharyn Hu</title>
		<link rel="stylesheet" type="text/css" href="/css/main.css">
		<link rel="stylesheet" href="/css/syntax.css">
		<script src="https://cdn.mathjax.org/mathjax/latest/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>
		<script type="text/x-mathjax-config">
			MathJax.Hub.Config({
				tex2jax: {
					skipTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
					inlineMath: [['$','$']]
				}
			});
		</script>
	</head>
	<body>
		<header class="site-header">
			<a class="site-title" href="/">Sharyn Hu</a>
			<p class="site-tagline">Notes on computer science, systems, and machine learning.</p>
			<nav class="site-nav">
				<a href="/">Home</a>
				<a href="/about">About</a>
				<a href="/blog">Blog</a>
			</nav>
		</header>

		<main class="container">
			<div class="home-spacer"></div>

		</main>

		<style>
			html body {
				max-width: none !important;
				margin: 0 !important;
				padding: 0 24px !important;
				color: var(--text) !important;
				background: var(--bg) !important;
				white-space: normal !important;
			}

			.site-header,
			.container,
			.site-footer {
				max-width: 1120px !important;
				margin-left: auto !important;
				margin-right: auto !important;
			}

			.site-header a,
			.site-nav a,
			.site-footer a {
				text-decoration: none !important;
			}

			.post {
				max-width: 1040px !important;
			}

			.post-header {
				margin-bottom: 2.25rem !important;
				text-align: left !important;
			}

			.post-title {
				font-size: 2.25rem !important;
				line-height: 1.2 !important;
			}

			.post .page-body {
				counter-reset: section;
			}

			.post .page h1 {
				counter-increment: section;
				counter-reset: subsection;
				font-size: 1.55rem !important;
				line-height: 1.3 !important;
			}

			.post .page h1::before {
				content: counter(section) ". ";
				color: var(--muted);
			}

			.post .page h2 {
				counter-increment: subsection;
				counter-reset: subsubsection;
				font-size: 1.25rem !important;
				line-height: 1.35 !important;
			}

			.post .page h2::before {
				content: counter(section) "." counter(subsection) " ";
				color: var(--muted);
			}

			.post .page h3 {
				counter-increment: subsubsection;
				font-size: 1.1rem !important;
				line-height: 1.35 !important;
			}

			.post .page h3::before {
				content: counter(section) "." counter(subsection) "." counter(subsubsection) " ";
				color: var(--muted);
			}
		</style>

		<footer class="site-footer">
			<a href="mailto:xiaojinghu826@gmail.com">xiaojinghu826@gmail.com</a>
			<a href="https://github.com/SharynHu">github.com/SharynHu</a>
		</footer>
	</body>
</html>
