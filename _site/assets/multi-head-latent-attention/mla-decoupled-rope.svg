<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">Decoupled RoPE design in MLA</title>
  <desc id="desc">MLA keeps content keys absorption-friendly by leaving RoPE out of the large content path and storing only a small RoPE key path.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbfb; }
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
      .content { fill: #eef4ff; stroke: #3f6fb5; stroke-width: 2; }
      .rope { fill: #fff3d6; stroke: #b7791f; stroke-width: 2; }
      .score { fill: #f1f8ff; stroke: #0969da; stroke-width: 2; }
      .bad { fill: #fff1f1; stroke: #d1242f; stroke-width: 2; }
      .text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; }
      .small { fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
      .mono { fill: #24292f; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
      .arrow { stroke: #57606a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .warn { stroke: #d1242f; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#warnArrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
    <marker id="warnArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d1242f"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="540"/>
  <text class="text" x="40" y="44" font-weight="700">Why RoPE must be decoupled</text>
  <text class="small" x="40" y="70">Position-dependent rotation prevents one fixed absorbed projection for all cached tokens.</text>

  <rect class="bad" x="52" y="116" width="360" height="116" rx="8"/>
  <text class="text" x="82" y="152">If full K carries RoPE</text>
  <text class="mono" x="82" y="184">K_rotated(j) = R(j) K</text>
  <text class="small" x="82" y="210">Every cached token has a different R(j)</text>

  <rect class="box" x="526" y="116" width="360" height="116" rx="8"/>
  <text class="text" x="562" y="152">Absorption wants one fixed matrix</text>
  <text class="mono" x="562" y="184">W_Q_abs = W_Q W_UK^T</text>
  <text class="small" x="562" y="210">This works only for the position-free content path</text>

  <path class="warn" d="M412 174 H518"/>
  <text class="small" x="445" y="154" fill="#d1242f">breaks</text>

  <rect class="content" x="70" y="310" width="270" height="112" rx="8"/>
  <text class="text" x="109" y="346">content path</text>
  <text class="mono" x="95" y="376">c_kv -> K_nope, V</text>
  <text class="small" x="105" y="403">large, no RoPE, absorption-friendly</text>

  <rect class="rope" x="70" y="438" width="270" height="64" rx="8"/>
  <text class="text" x="105" y="477">small RoPE key path</text>

  <rect class="score" x="490" y="336" width="394" height="132" rx="8"/>
  <text class="text" x="535" y="374">attention score</text>
  <text class="mono" x="535" y="408">score = Q_nope K_nope</text>
  <text class="mono" x="604" y="434">+ Q_rope K_rope</text>

  <path class="arrow" d="M340 366 H482"/>
  <path class="arrow" d="M340 470 C415 470 440 430 482 430"/>
</svg>
