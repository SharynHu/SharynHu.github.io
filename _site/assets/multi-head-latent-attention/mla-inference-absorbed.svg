<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">MLA inference-time absorbed computation</title>
  <desc id="desc">During inference, the cache holds c_kv and K_rope. Absorbed query projections compute scores against c_kv, and the value-side projection is applied after latent aggregation.</desc>
  <defs>
    <style>
      .bg { fill: #fbfbfb; }
      .cache { fill: #e7f5ef; stroke: #2f7d5c; stroke-width: 2; }
      .query { fill: #eef4ff; stroke: #3f6fb5; stroke-width: 2; }
      .rope { fill: #fff3d6; stroke: #b7791f; stroke-width: 2; }
      .compute { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
      .out { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; }
      .text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; }
      .small { fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
      .mono { fill: #24292f; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
      .arrow { stroke: #57606a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="520"/>
  <text class="text" x="40" y="44" font-weight="700">Inference-time absorbed MLA</text>
  <text class="small" x="40" y="70">The full per-head K/V tensors are not stored in the cache.</text>

  <rect class="query" x="50" y="130" width="210" height="96" rx="8"/>
  <text class="text" x="91" y="166">new token</text>
  <text class="mono" x="84" y="194">Q_abs, Q_rope</text>

  <rect class="cache" x="50" y="296" width="210" height="112" rx="8"/>
  <text class="text" x="97" y="332">KV cache</text>
  <text class="mono" x="82" y="362">c_kv: 512</text>
  <text class="mono" x="82" y="388">K_rope: 64</text>

  <rect class="compute" x="370" y="126" width="250" height="118" rx="8"/>
  <text class="text" x="415" y="164">score path</text>
  <text class="mono" x="398" y="194">Q_abs c_kv^T</text>
  <text class="mono" x="398" y="220">+ Q_rope K_rope^T</text>

  <rect class="compute" x="370" y="310" width="250" height="116" rx="8"/>
  <text class="text" x="407" y="348">value path</text>
  <text class="mono" x="393" y="378">softmax(score) c_kv</text>
  <text class="small" x="397" y="404">then apply value-side up-proj</text>

  <rect class="out" x="730" y="214" width="206" height="112" rx="8"/>
  <text class="text" x="772" y="254">attention</text>
  <text class="text" x="784" y="282">output</text>
  <text class="small" x="766" y="307">project through W_O</text>

  <path class="arrow" d="M260 178 H362"/>
  <path class="arrow" d="M260 352 H362"/>
  <path class="arrow" d="M495 244 V302"/>
  <path class="arrow" d="M620 368 C685 368 696 282 722 274"/>
  <path class="arrow" d="M620 184 C682 184 694 238 722 252"/>
</svg>
