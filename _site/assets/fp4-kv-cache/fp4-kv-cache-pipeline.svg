<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
  <title id="title">FP4 KV cache write and read pipeline</title>
  <desc id="desc">A flat technical diagram showing FP4 KV cache write and read paths, external scale metadata, FP4 format decoding, and attention consumption.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowMeta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .title {
        font-size: 38px;
        font-weight: 850;
        fill: #111827;
      }
      .subtitle {
        font-size: 20px;
        font-weight: 560;
        fill: #64748b;
      }
      .panel-title {
        font-size: 28px;
        font-weight: 820;
      }
      .step-title {
        font-size: 23px;
        font-weight: 800;
      }
      .step-copy {
        font-size: 16px;
        font-weight: 620;
        fill: #475569;
      }
      .chip {
        font-size: 15px;
        font-weight: 760;
      }
      .meta-title {
        font-size: 25px;
        font-weight: 830;
        fill: #334155;
      }
      .meta-copy {
        font-size: 17px;
        font-weight: 610;
        fill: #64748b;
      }
      .note {
        font-size: 18px;
        font-weight: 650;
        fill: #475569;
      }
    </style>
  </defs>

  <rect width="1440" height="1120" fill="#ffffff"/>
  <rect x="32" y="32" width="1376" height="1056" rx="28" fill="#fbfaf8" stroke="#e2e8f0" stroke-width="2"/>

  <text x="86" y="96" class="title">FP4 KV Cache: Write Quantize, Read Reconstruct</text>
  <text x="86" y="130" class="subtitle">FP4 codes store the compact cache. External scale metadata maps those codes back to approximate K,V values.</text>

  <rect x="86" y="178" width="520" height="700" rx="22" fill="#eef6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="834" y="178" width="520" height="700" rx="22" fill="#fff6eb" stroke="#fdba74" stroke-width="2"/>
  <text x="126" y="232" class="panel-title" fill="#1d4ed8">Write cache path</text>
  <text x="874" y="232" class="panel-title" fill="#c2410c">Read cache path</text>

  <g>
    <rect x="150" y="276" width="392" height="82" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="404" width="392" height="82" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="532" width="392" height="82" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="660" width="392" height="82" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="150" y="788" width="392" height="82" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>

    <rect x="898" y="276" width="392" height="82" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="898" y="404" width="392" height="82" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="898" y="532" width="392" height="82" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="898" y="660" width="392" height="82" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <rect x="898" y="788" width="392" height="82" rx="14" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  </g>

  <text x="346" y="309" text-anchor="middle" class="step-title" fill="#1e3a8a">FP16/BF16 K,V</text>
  <text x="346" y="336" text-anchor="middle" class="step-copy">produced by model</text>

  <text x="346" y="437" text-anchor="middle" class="step-title" fill="#1e3a8a">Choose / load external scale</text>
  <text x="346" y="464" text-anchor="middle" class="step-copy">scale is shared by this group</text>

  <text x="346" y="565" text-anchor="middle" class="step-title" fill="#1e3a8a">Divide by external scale</text>
  <text x="346" y="592" text-anchor="middle" class="step-copy">fit values into FP4 local range</text>

  <text x="346" y="693" text-anchor="middle" class="step-title" fill="#1e3a8a">Round / clamp to FP4 code</text>
  <text x="346" y="720" text-anchor="middle" class="step-copy">choose one of the 16 FP4 codes</text>

  <text x="346" y="821" text-anchor="middle" class="step-title" fill="#1e3a8a">Store cache</text>
  <text x="346" y="848" text-anchor="middle" class="step-copy">FP4 codes + scale metadata</text>

  <text x="1094" y="309" text-anchor="middle" class="step-title" fill="#9a3412">Load cache</text>
  <text x="1094" y="336" text-anchor="middle" class="step-copy">FP4 codes + scale metadata</text>

  <text x="1094" y="437" text-anchor="middle" class="step-title" fill="#9a3412">Decode FP4 code</text>
  <text x="1094" y="464" text-anchor="middle" class="step-copy">according to FP4 format rules</text>

  <text x="1094" y="565" text-anchor="middle" class="step-title" fill="#9a3412">Multiply by external scale</text>
  <text x="1094" y="592" text-anchor="middle" class="step-copy">map back to tensor value range</text>

  <text x="1094" y="693" text-anchor="middle" class="step-title" fill="#9a3412">Compute-friendly K,V</text>
  <text x="1094" y="720" text-anchor="middle" class="step-copy">FP8, FP16/BF16, or backend internal</text>

  <text x="1094" y="821" text-anchor="middle" class="step-title" fill="#9a3412">Attention uses K,V</text>
  <text x="1094" y="848" text-anchor="middle" class="step-copy">possibly fused; may not materialize full tensor</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M346 358 L346 391" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M346 486 L346 519" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M346 614 L346 647" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M346 742 L346 775" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <path d="M1094 358 L1094 391" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1094 486 L1094 519" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1094 614 L1094 647" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1094 742 L1094 775" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  </g>

  <rect x="588" y="324" width="264" height="226" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="720" y="365" text-anchor="middle" class="meta-title">FP4 format rules</text>
  <text x="720" y="402" text-anchor="middle" class="meta-copy">E2M1 intuition</text>
  <text x="720" y="433" text-anchor="middle" class="meta-copy">1 sign bit</text>
  <text x="720" y="464" text-anchor="middle" class="meta-copy">2 exponent bits</text>
  <text x="720" y="495" text-anchor="middle" class="meta-copy">1 mantissa bit</text>
  <text x="720" y="526" text-anchor="middle" class="meta-copy">16 possible codes</text>

  <rect x="370" y="936" width="700" height="98" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="720" y="974" text-anchor="middle" class="meta-title">External scale metadata</text>
  <text x="720" y="1005" text-anchor="middle" class="meta-copy">shared by a group; stored with or associated with KV cache blocks</text>

  <g fill="none" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 9">
    <path d="M370 985 L108 985 L108 445 L142 445" marker-end="url(#arrowMeta)"/>
    <path d="M370 985 L108 985 L108 573 L142 573" marker-end="url(#arrowMeta)"/>
    <path d="M1070 985 L1332 985 L1332 573 L1298 573" marker-end="url(#arrowMeta)"/>
    <path d="M588 437 L562 437 L562 701 L550 701" marker-end="url(#arrowMeta)"/>
    <path d="M852 437 L878 437 L878 445 L890 445" marker-end="url(#arrowMeta)"/>
  </g>

  <rect x="132" y="902" width="428" height="28" rx="14" fill="#dbeafe"/>
  <text x="346" y="922" text-anchor="middle" class="chip" fill="#1e3a8a">write: scale maps K,V into the FP4 local range</text>

  <rect x="880" y="902" width="428" height="28" rx="14" fill="#ffedd5"/>
  <text x="1094" y="922" text-anchor="middle" class="chip" fill="#9a3412">read: FP4 decode plus scale reconstructs K,V</text>

  <text x="720" y="1068" text-anchor="middle" class="note">Conceptual pipeline: optimized backends may fuse decode, scale multiply, and attention into one kernel.</text>
</svg>
