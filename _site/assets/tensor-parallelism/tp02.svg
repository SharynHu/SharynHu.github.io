<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 650" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  
  <defs>
    <!-- Standard Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 7 5 L 1 8 Z" fill="#222222" stroke="#222222" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Title / Context -->
  <text x="30" y="35" font-size="14" fill="#666666" font-weight="500" letter-spacing="0.5">
    Context: Tensor parallelism for QKV projection in 4 GPUs
  </text>

  <!-- ==========================================
       1. INPUT TENSOR (x)
       ========================================== -->
  <!-- Top x block -->
  <rect x="220" y="60" width="360" height="40" fill="#E4EDDC" stroke="#222222" stroke-width="2.5" />
  <text x="400" y="87" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-style="italic" font-weight="500" font-size="24" fill="#222222" text-anchor="middle">x</text>

  <!-- ==========================================
       2. TOP ARROWS (Fanning out)
       ========================================== -->
  <path d="M 265 105 Q 235 135 235 170" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 355 105 Q 345 135 345 170" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 445 105 Q 455 135 455 170" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 535 105 Q 565 135 565 170" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />


  <!-- ==========================================
       3. W_q MATRIX SHARDS
       ========================================== -->
       
  <!-- GPU 0: Pink Shard -->
  <g transform="translate(190, 180)">
    <rect x="0" y="0" width="90" height="260" fill="#F9D3EB" stroke="#222222" stroke-width="2.5" />
    <line x1="30" y1="0" x2="30" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="60" y1="0" x2="60" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="45" y="135" font-weight="500" fill="#222222" font-size="20" text-anchor="middle" letter-spacing="2">...</text>
  </g>

  <!-- GPU 1: Green Shard -->
  <g transform="translate(300, 180)">
    <rect x="0" y="0" width="90" height="260" fill="#D7F5BF" stroke="#222222" stroke-width="2.5" />
    <line x1="30" y1="0" x2="30" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="60" y1="0" x2="60" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="45" y="135" font-weight="500" fill="#222222" font-size="20" text-anchor="middle" letter-spacing="2">...</text>
  </g>

  <!-- GPU 2: Blue Shard -->
  <g transform="translate(410, 180)">
    <rect x="0" y="0" width="90" height="260" fill="#C6DEFC" stroke="#222222" stroke-width="2.5" />
    <line x1="30" y1="0" x2="30" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="60" y1="0" x2="60" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="45" y="135" font-weight="500" fill="#222222" font-size="20" text-anchor="middle" letter-spacing="2">...</text>
  </g>

  <!-- GPU 3: Red/Salmon Shard -->
  <g transform="translate(520, 180)">
    <rect x="0" y="0" width="90" height="260" fill="#FAC6BF" stroke="#222222" stroke-width="2.5" />
    <line x1="30" y1="0" x2="30" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <line x1="60" y1="0" x2="60" y2="260" stroke="#222222" stroke-width="1.2" stroke-opacity="0.8" />
    <text x="45" y="135" font-weight="500" fill="#222222" font-size="20" text-anchor="middle" letter-spacing="2">...</text>
  </g>


  <!-- ==========================================
       4. TEXT ANNOTATION (Right Side)
       ========================================== -->
  <text x="635" y="280" font-weight="500" fill="#222222" font-size="24">
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-style="italic">W</tspan>
    <tspan dy="8" font-size="16" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">q</tspan>
    <tspan dy="-8"> sharded by</tspan>
  </text>
  <text x="635" y="315" font-weight="500" fill="#222222" font-size="24">column</text>


  <!-- ==========================================
       5. BOTTOM ARROWS (Straight down)
       ========================================== -->
  <path d="M 235 445 L 235 480" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 345 445 L 345 480" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 455 445 L 455 480" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 565 445 L 565 480" fill="none" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)" />


  <!-- ==========================================
       6. OUTPUT TENSORS (q)
       ========================================== -->
       
  <!-- q0 (Pink) -->
  <rect x="190" y="495" width="90" height="40" fill="#F9D3EB" stroke="#222222" stroke-width="2.5" />
  <text x="235" y="522" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-style="italic" font-weight="500" font-size="22" fill="#222222" text-anchor="middle">q<tspan dy="4" font-size="16" font-style="normal">0</tspan></text>

  <!-- q1 (Green) -->
  <rect x="300" y="495" width="90" height="40" fill="#D7F5BF" stroke="#222222" stroke-width="2.5" />
  <text x="345" y="522" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-style="italic" font-weight="500" font-size="22" fill="#222222" text-anchor="middle">q<tspan dy="4" font-size="16" font-style="normal">1</tspan></text>

  <!-- q2 (Blue) -->
  <rect x="410" y="495" width="90" height="40" fill="#C6DEFC" stroke="#222222" stroke-width="2.5" />
  <text x="455" y="522" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-style="italic" font-weight="500" font-size="22" fill="#222222" text-anchor="middle">q<tspan dy="4" font-size="16" font-style="normal">2</tspan></text>

  <!-- q3 (Red/Salmon) -->
  <rect x="520" y="495" width="90" height="40" fill="#FAC6BF" stroke="#222222" stroke-width="2.5" />
  <text x="565" y="522" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-style="italic" font-weight="500" font-size="22" fill="#222222" text-anchor="middle">q<tspan dy="4" font-size="16" font-style="normal">3</tspan></text>

</svg>