<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 480" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, sans-serif;">
  
  <defs>
    <!-- Standard Arrowhead Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 Z" fill="#222222" stroke="#222222" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ==========================================
       CONTEXT HEADERS
       ========================================== -->
  <text x="50" y="40" font-size="18" fill="#333333">
    <tspan font-weight="700">Context:</tspan> Tensor Parallelism for Output Projection (W
    <tspan dy="6" font-size="14">o</tspan>
    <tspan dy="-6">)</tspan>
  </text>
  <text x="50" y="65" font-size="15" fill="#666666">
    Each GPU computes a partial sum: 
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1D4ED8" font-weight="600">partial_i = attn_out_i @ W_o_shard_i</tspan>
  </text>


  <!-- ==========================================
       1. LEFT VECTOR (attn_out_i / concatenated heads)
       ========================================== -->
       
  <!-- Brace over Green Block -->
  <path d="M 100 140 Q 100 130 130 130 Q 140 130 140 120 Q 140 130 150 130 Q 180 130 180 140" fill="none" stroke="#222222" stroke-width="1.8" />
  <text x="140" y="110" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="600" fill="#222222" text-anchor="middle">
    (num_heads/4) × d_head
  </text>

  <!-- Vector Blocks -->
  <!-- GPU 0: Green -->
  <rect x="100" y="150" width="80" height="40" fill="#D7F5BF" stroke="#222222" stroke-width="2" />
  <!-- GPU 1: Pink -->
  <rect x="180" y="150" width="80" height="40" fill="#F9D3EB" stroke="#222222" stroke-width="2" />
  <!-- GPU 2: Blue -->
  <rect x="260" y="150" width="80" height="40" fill="#C6DEFC" stroke="#222222" stroke-width="2" />
  <!-- GPU 3: Red/Salmon -->
  <rect x="340" y="150" width="80" height="40" fill="#FAC6BF" stroke="#222222" stroke-width="2" />


  <!-- ==========================================
       2. ARROW & "dot product"
       ========================================== -->
  <path d="M 140 190 C 140 330, 350 330, 505 160" fill="none" stroke="#222222" stroke-width="2" marker-end="url(#arrow)" />
  
  <text x="320" y="280" font-size="22" font-weight="500" font-style="italic" fill="#222222" text-anchor="middle">
    dot product
  </text>


  <!-- ==========================================
       3. RIGHT STACKED MATRICES (W_o_shard_i)
       ========================================== -->
       
  <!-- Top Brace (over the width of the matrix stack) -->
  <path d="M 520 85 Q 520 70 660 70 Q 680 70 680 60 Q 680 70 700 70 Q 840 70 840 85" fill="none" stroke="#222222" stroke-width="1.8" />
  <text x="680" y="50" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="600" fill="#222222" text-anchor="middle">
    d_model
  </text>

  <!-- GPU 0 Matrix: Green (Back layer) -->
  <g>
    <rect x="520" y="100" width="320" height="100" fill="#D7F5BF" stroke="#222222" stroke-width="2" />
    <line x1="570" y1="100" x2="570" y2="200" stroke="#222222" stroke-width="1.5" />
    <line x1="620" y1="100" x2="620" y2="200" stroke="#222222" stroke-width="1.5" />
    <text x="680" y="155" font-size="24" font-weight="600" fill="#222222" text-anchor="middle" letter-spacing="4">...</text>
    <line x1="740" y1="100" x2="740" y2="200" stroke="#222222" stroke-width="1.5" />
    <line x1="790" y1="100" x2="790" y2="200" stroke="#222222" stroke-width="1.5" />
  </g>

  <!-- GPU 1 Matrix: Pink -->
  <g>
    <rect x="560" y="140" width="320" height="100" fill="#F9D3EB" stroke="#222222" stroke-width="2" />
    <line x1="610" y1="140" x2="610" y2="240" stroke="#222222" stroke-width="1.5" />
    <line x1="660" y1="140" x2="660" y2="240" stroke="#222222" stroke-width="1.5" />
    <text x="720" y="195" font-size="24" font-weight="600" fill="#222222" text-anchor="middle" letter-spacing="4">...</text>
    <line x1="780" y1="140" x2="780" y2="240" stroke="#222222" stroke-width="1.5" />
    <line x1="830" y1="140" x2="830" y2="240" stroke="#222222" stroke-width="1.5" />
  </g>

  <!-- GPU 2 Matrix: Blue -->
  <g>
    <rect x="600" y="180" width="320" height="100" fill="#C6DEFC" stroke="#222222" stroke-width="2" />
    <line x1="650" y1="180" x2="650" y2="280" stroke="#222222" stroke-width="1.5" />
    <line x1="700" y1="180" x2="700" y2="280" stroke="#222222" stroke-width="1.5" />
    <text x="760" y="235" font-size="24" font-weight="600" fill="#222222" text-anchor="middle" letter-spacing="4">...</text>
    <line x1="820" y1="180" x2="820" y2="280" stroke="#222222" stroke-width="1.5" />
    <line x1="870" y1="180" x2="870" y2="280" stroke="#222222" stroke-width="1.5" />
  </g>

  <!-- GPU 3 Matrix: Red/Salmon (Front layer) -->
  <g>
    <rect x="640" y="220" width="320" height="100" fill="#FAC6BF" stroke="#222222" stroke-width="2" />
    <line x1="690" y1="220" x2="690" y2="320" stroke="#222222" stroke-width="1.5" />
    <line x1="740" y1="220" x2="740" y2="320" stroke="#222222" stroke-width="1.5" />
    <text x="800" y="275" font-size="24" font-weight="600" fill="#222222" text-anchor="middle" letter-spacing="4">...</text>
    <line x1="860" y1="220" x2="860" y2="320" stroke="#222222" stroke-width="1.5" />
    <line x1="910" y1="220" x2="910" y2="320" stroke="#222222" stroke-width="1.5" />
  </g>


  <!-- ==========================================
       4. RIGHTMOST BRACE (AllReduce Summation)
       ========================================== -->
  <path d="M 975 100 Q 990 100 990 190 Q 990 210 1000 210 Q 990 210 990 230 Q 990 320 975 320" fill="none" stroke="#222222" stroke-width="1.8" />
  
  <text x="1015" y="215" font-size="22" font-weight="600" fill="#222222" alignment-baseline="middle">
    AllReduce (Sum)
  </text>

</svg>