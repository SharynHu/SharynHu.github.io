<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" width="100%" height="100%" style="background-color: #ffffff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol';">
  
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 6 5 L 1 8" fill="none" stroke="#888780" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    
    <!-- Monospace font definition for reuse -->
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .sans { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- ==========================================
       1. INPUT VECTOR ROW
       ========================================== -->
  <text x="30" y="30" class="sans" font-size="12" fill="#555" font-weight="500">
    input vector <tspan fill="#888" font-size="11" font-weight="400" dx="4">[d_model]</tspan>
  </text>

  <!-- x0 -->
  <rect x="30" y="42" width="46" height="38" rx="5" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1.2" />
  <text x="53" y="62" class="mono" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">x₀</text>

  <!-- x1 -->
  <rect x="80" y="42" width="46" height="38" rx="5" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1.2" />
  <text x="103" y="62" class="mono" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">x₁</text>

  <!-- x2 -->
  <rect x="130" y="42" width="46" height="38" rx="5" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1.2" />
  <text x="153" y="62" class="mono" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">x₂</text>

  <!-- x3 -->
  <rect x="180" y="42" width="46" height="38" rx="5" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1.2" />
  <text x="203" y="62" class="mono" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">x₃</text>

  <!-- dots -->
  <text x="244" y="62" class="sans" font-size="18" fill="#888" text-anchor="middle" dominant-baseline="central" letter-spacing="1">···</text>

  <!-- x_{d-1} (dimmed) -->
  <rect x="262" y="42" width="56" height="38" rx="5" fill="#F4FBF8" stroke="#9FE1CB" stroke-width="1.2" />
  <text x="290" y="62" class="mono" font-size="12" font-weight="600" fill="#1D9E75" text-anchor="middle" dominant-baseline="central">
    x<tspan dy="3" font-size="9.5">d−1</tspan>
  </text>


  <!-- ==========================================
       2. ARROWS AND CONNECTION AREA
       ========================================== -->
  <!-- Curve to Col 0 -->
  <path d="M 175 85 C 175 115, 100 115, 100 145" fill="none" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)" />
  
  <!-- Curve to Col 1 (dashed) -->
  <path d="M 175 85 C 175 115, 210 115, 210 145" fill="none" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)" />

  <!-- "dot product" label with white background to hide lines -->
  <rect x="135" y="105" width="80" height="20" fill="#ffffff" />
  <text x="175" y="119" class="sans" font-size="11.5" fill="#888" text-anchor="middle">dot product</text>


  <!-- ==========================================
       3. WEIGHT MATRIX LABEL
       ========================================== -->
  <text x="30" y="165" class="sans" font-size="12" fill="#555" font-weight="500">
    weight matrix W <tspan fill="#888" font-size="11" font-weight="400" dx="4">[d_model, d_out] — each column is independent</tspan>
  </text>


  <!-- ==========================================
       4. COLUMN 0 ELEMENTS
       ========================================== -->
  <text x="100" y="190" class="sans" font-size="11" font-weight="600" fill="#3C3489" text-anchor="middle">col 0</text>

  <!-- w0,0 -->
  <rect x="60" y="200" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="100" y="221" class="mono" font-size="11.5" font-weight="500" fill="#3C3489" text-anchor="middle">w₀,₀</text>

  <!-- w1,0 -->
  <rect x="60" y="236" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="100" y="257" class="mono" font-size="11.5" font-weight="500" fill="#3C3489" text-anchor="middle">w₁,₀</text>

  <!-- w2,0 -->
  <rect x="60" y="272" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="100" y="293" class="mono" font-size="11.5" font-weight="500" fill="#3C3489" text-anchor="middle">w₂,₀</text>

  <!-- ⋮ -->
  <text x="100" y="324" class="sans" font-size="20" fill="#888" text-anchor="middle">⋮</text>

  <!-- wd-1,0 -->
  <rect x="60" y="334" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="100" y="355" class="mono" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle">w<tspan dy="2" font-size="9.5">d−1,0</tspan></text>

  <!-- Down arrow indicator -->
  <text x="100" y="388" class="sans" font-size="18" fill="#888" text-anchor="middle">↓</text>

  <!-- q0 output (Changed from y0) -->
  <rect x="60" y="402" width="80" height="40" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5" />
  <text x="100" y="428" class="mono" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">q₀</text>

  <!-- Sub-label -->
  <text x="100" y="458" class="sans" font-size="10.5" fill="#666" text-anchor="middle">x · col₀</text>


  <!-- ==========================================
       5. COLUMN 1 ELEMENTS
       ========================================== -->
  <text x="210" y="190" class="sans" font-size="11" font-weight="600" fill="#3C3489" text-anchor="middle">col 1</text>

  <!-- w0,1 -->
  <rect x="170" y="200" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="210" y="221" class="mono" font-size="11.5" font-weight="500" fill="#3C3489" text-anchor="middle">w₀,₁</text>

  <!-- w1,1 -->
  <rect x="170" y="236" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="210" y="257" class="mono" font-size="11.5" font-weight="500" fill="#3C3489" text-anchor="middle">w₁,₁</text>

  <!-- w2,1 -->
  <rect x="170" y="272" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="210" y="293" class="mono" font-size="11.5" font-weight="500" fill="#3C3489" text-anchor="middle">w₂,₁</text>

  <!-- ⋮ -->
  <text x="210" y="324" class="sans" font-size="20" fill="#888" text-anchor="middle">⋮</text>

  <!-- wd-1,1 -->
  <rect x="170" y="334" width="80" height="32" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1.2" />
  <text x="210" y="355" class="mono" font-size="11" font-weight="500" fill="#3C3489" text-anchor="middle">w<tspan dy="2" font-size="9.5">d−1,1</tspan></text>

  <!-- Down arrow indicator -->
  <text x="210" y="388" class="sans" font-size="18" fill="#888" text-anchor="middle">↓</text>

  <!-- q1 output (Changed from y1) -->
  <rect x="170" y="402" width="80" height="40" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1.5" />
  <text x="210" y="428" class="mono" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">q₁</text>

  <!-- Sub-label -->
  <text x="210" y="458" class="sans" font-size="10.5" fill="#666" text-anchor="middle">x · col₁</text>


  <!-- ==========================================
       6. ELLIPSIS COLUMN
       ========================================== -->
  <text x="300" y="300" class="sans" font-size="22" fill="#888" text-anchor="middle" letter-spacing="2">···</text>


  <!-- ==========================================
       7. FOOTNOTE
       ========================================== -->
  <rect x="30" y="490" width="540" height="75" rx="7" fill="#F8F8FA" stroke="#E2E2E6" stroke-width="1.2" />
  
  <text x="45" y="515" class="sans" font-size="12" fill="#555">
    <tspan font-weight="600" fill="#333">Why column-wise sharding works:</tspan> each <tspan class="mono" font-size="11">qᵢ = x · colᵢ</tspan> uses all of <tspan class="mono" font-size="11">x</tspan> but has zero dependency
  </text>
  <text x="45" y="535" class="sans" font-size="12" fill="#555">
    on any other column. GPU 0 can compute <tspan class="mono" font-size="11">q₀</tspan> and GPU 1 can compute <tspan class="mono" font-size="11">q₁</tspan> in parallel — no
  </text>
  <text x="45" y="555" class="sans" font-size="12" fill="#555">
    communication needed until AllReduce.
  </text>

</svg>